<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NURA AI LABS</title>
  <meta name="description" content="Sign in to your NURA AI Labs account. Secure distributed session management.">

  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Modern Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Header Navigation -->
  <header>
    <nav class="navbar navbar-custom">
      <div class="container">
        <a class="navbar-brand brand-badge" href="index.html" id="navBrandLink">
          <div class="brand-logo-icon">N</div>
          <div>
            <span>NURA AI LABS</span>
            <div class="sub-text">Security Portal</div>
          </div>
        </a>
        <a href="register.html" class="btn btn-secondary-custom px-3 py-2 small" id="navRegisterRedirectBtn">
          <i class="bi bi-person-plus-fill"></i> Need an account? Register
        </a>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">

          <div class="glass-card">
            <div class="text-center mb-4">
              <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                <i class="bi bi-shield-lock-fill fs-2"></i>
              </div>
              <h1 class="h3 fw-bold text-white mb-1">Welcome Back</h1>
              <p class="text-secondary small mb-0">Sign in to access your researcher console</p>
            </div>

            <!-- Dynamic Feedback Alert Container -->
            <div id="alertContainer"></div>

            <!-- Login Form (Handled via jQuery AJAX) -->
            <form id="loginForm" novalidate>
              <!-- Hidden CSRF Token Field for fallback -->
              <input type="hidden" name="csrf_token" id="csrfTokenField" value="">

              <!-- Identifier (Username or Email) Field -->
              <div class="mb-3">
                <label for="identifier" class="form-label">Username or Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary">
                    <i class="bi bi-person-circle"></i>
                  </span>
                  <input type="text" class="form-control form-control-custom" id="identifier" name="identifier" placeholder="e.g. rohith_ai or name@example.com" autocomplete="username" required autofocus>
                </div>
              </div>

              <!-- Password Field -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                  <label for="password" class="form-label mb-0">Password</label>
                </div>
                <div class="input-group-custom mt-2">
                  <input type="password" class="form-control form-control-custom pe-5" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                  <button type="button" class="input-password-toggle" data-target="password" title="Toggle password visibility" id="togglePasswordBtn">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-primary-custom w-100 py-3 mb-3" id="loginBtn">
                <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                <span id="btnText"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account</span>
              </button>

              <div class="text-center pt-2">
                <span class="text-secondary small">Don't have an account yet?</span>
                <a href="register.html" class="text-primary text-decoration-none fw-semibold small ms-1" id="footerRegisterLink">Register here</a>
              </div>
            </form>

          </div>

          <!-- Bottom Privacy & Info Note -->
          <div class="text-center mt-4">
            <span class="text-secondary small">
              <i class="bi bi-fingerprint me-1"></i> Distributed session stored in Redis with 1-hour active TTL.
            </span>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-auto py-3">
    <div class="container text-center">
      <p class="text-muted small mb-0">&copy; 2026 NURA AI Labs • Distributed Authentication Platform</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jQuery 3.7.1 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Login Logic -->
  <script src="js/login.js"></script>
</body>
</html>
